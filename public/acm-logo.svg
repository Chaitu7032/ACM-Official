<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#1E90FF" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Diamond -->
  <polygon points="50,6 94,50 50,94 6,50" fill="url(#diamondGrad)" filter="url(#cyanGlow)" />
  <!-- Inner Border -->
  <polygon points="50,11 89,50 50,89 11,50" fill="#030b1e" stroke="#00D4FF" stroke-width="1.5" />
  <!-- Stylized acm Text -->
  <text x="50" y="58" font-family="'Outfit', 'Space Grotesk', system-ui, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.04em">acm</text>
</svg>
